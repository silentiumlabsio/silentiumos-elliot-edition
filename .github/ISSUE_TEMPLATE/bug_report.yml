name: Bug report
description: Report a reproducible problem without sharing private device or game data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve SilentiumOS. Remove IP addresses, serial numbers, account details, local paths, production PINs, logs containing private data, ROMs, APKs, and emulator cores before submitting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I reviewed this report and its attachments for private identifiers and prohibited files.
          required: true
  - type: input
    id: version
    attributes:
      label: SilentiumOS version or commit
      placeholder: 0.7.6-public-source or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected area
      options:
        - Dashboard/navigation
        - Parent tools
        - Boot/Home redirect
        - Console Guard
        - Legal-library tooling
        - RetroArch launch integration
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use sanitized, legally redistributable test data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
