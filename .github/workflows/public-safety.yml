name: Public safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Public-release audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan for prohibited artifacts and sensitive values
        shell: pwsh
        run: ./scripts/audit-public-release.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse Python tools
        shell: pwsh
        run: >-
          python -c "import ast,pathlib;
          [ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          for p in pathlib.Path('tools').glob('*.py')]"

      - name: Run cross-platform public audit
        run: python tools/audit_public_release.py .

      - name: Test public audit rules
        run: python -m unittest discover -s tests -v

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Test game catalog contracts
        shell: pwsh
        run: ./scripts/test-java.ps1
