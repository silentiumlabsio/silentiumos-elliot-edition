name: Public safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Public-release audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan for prohibited artifacts and sensitive values
        shell: pwsh
        run: ./scripts/audit-public-release.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse Python tools
        shell: pwsh
        run: >-
          python -c "import ast,pathlib;
          [ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          for p in pathlib.Path('tools').glob('*.py')]"
