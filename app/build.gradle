plugins {
    id 'com.android.application'
}

android {
    namespace 'com.silentiumlabs.silentiumos'
    compileSdk 36

    defaultConfig {
        applicationId 'com.silentiumlabs.silentiumos'
        minSdk 28
        targetSdk 28
        versionCode 20
        versionName '0.7.7-public-source'

        def configuredPin = project.findProperty('SILENTIUM_PARENT_PIN') ?: System.getenv('SILENTIUM_PARENT_PIN')
        if (configuredPin == null) {
            throw new GradleException(
                    'Set SILENTIUM_PARENT_PIN as a Gradle property or environment variable before building.')
        }
        if (!(configuredPin ==~ /\d{4}/)) {
            throw new GradleException('SILENTIUM_PARENT_PIN must be exactly four digits.')
        }
        def pinHash = java.security.MessageDigest
                .getInstance('SHA-256')
                .digest(configuredPin.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                .collect { String.format('%02x', it & 0xff) }
                .join()
        buildConfigField 'String', 'PARENT_PIN_SHA256', '"' + pinHash + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
